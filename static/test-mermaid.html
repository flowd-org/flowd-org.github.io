<!DOCTYPE html>
<html>

<head>
    <title>Mermaid Test</title>
    <script type="module">
        import mermaid from 'https://cdn.jsdelivr.net/npm/mermaid@10/dist/mermaid.esm.min.mjs';
        mermaid.initialize({
            startOnLoad: true,
            theme: 'base',
            themeVariables: {
                primaryColor: '#85c1dc',
                primaryTextColor: '#c6d0f5',
                primaryBorderColor: '#85c1dc',
                lineColor: '#a6d189',
                secondaryColor: '#303446',
                tertiaryColor: '#303446',
                clusterBkg: 'transparent',
                clusterBorder: '#85c1dc',
                edgeLabelBackground: '#303446',
                fontFamily: 'Overpass'
            }
        });
    </script>
    <style>
        body {
            background: #303446;
            color: #c6d0f5;
            font-family: 'Overpass', sans-serif;
            padding: 20px;
        }
    </style>
</head>

<body>
    <h1>Mermaid Cluster Label Test</h1>
    <div class="mermaid">
        flowchart LR
        subgraph User
        CLI["CLI (flwd)"]
        end

        subgraph Engine["flowd Engine"]
        Planner["Planner and Policy"]
        end
    </div>
</body>

</html>
